ezproxy.admin_form:
  path: /admin/config/ezproxy
  defaults:
    _title: 'Ezproxy module settings'
    _form: \Drupal\ezproxy\Form\EzproxyAdminForm
  requirements:
    _permission: 'access administration pages'

ezproxy.external:
  path: /ezproxy/auth/external
  defaults:
    _controller: '\Drupal\ezproxy\Controller\EzproxyController::externalAuth'
  requirements:
    _access: 'TRUE'

ezproxy.auth:
  path: /ezproxy/auth
  defaults:
    _controller: '\Drupal\ezproxy\Controller\EzproxyController::authenticate'
  requirements:
    _access: 'TRUE'

ezproxy.auth_form:
  path: /ezproxy/login
  defaults:
    _form: '\Drupal\ezproxy\Form\EzproxyAuthForm'
    _title: 'AADL Database Access Form'

ezproxy.auth_display:
  path: /ezproxy/libby
  defaults:
    _controller: '\Drupal\ezproxy\Controller\EzproxyController::display_login_libby'
  requirements:
    _access: 'TRUE'

ezproxy.auth_form_libby_cred:
  path: /ezproxy/libby-cred
  defaults:
    _form: '\Drupal\ezproxy\Form\EzproxyLibbyAuthCred'
    _title: 'AADL Libby Access'

ezproxy.auth_form_libby_card:
  path: /ezproxy/libby-card
  defaults:
    _form: '\Drupal\ezproxy\Form\EzproxyLibbyAuthCard'
    _title: 'AADL Libby Access'

ezproxy.auth_form_libby_select:
  path: /ezproxy/libby-select
  defaults:
    _form: '\Drupal\ezproxy\Form\EzproxyLibbyCardSelection'
    _title: 'AADL Libby Card Selection'