ezproxy.admin_form:
  path: /admin/config/ezproxy
  defaults:
    _title: 'Ezproxy module settings'
    _form: \Drupal\ezproxy\Form\EzproxyAdminForm
  requirements:
    _permission: 'access administration pages'

ezproxy.external:
  path: /ezproxy/auth/external
  defaults:
    _controller: '\Drupal\ezproxy\Controller\EzproxyController::externalAuth'
  requirements:
    _access: 'TRUE'

ezproxy.auth:
  path: /ezproxy/auth
  defaults:
    _controller: '\Drupal\ezproxy\Controller\EzproxyController::authenticate'
  requirements:
    _access: 'TRUE'

ezproxy.auth_form:
  path: /ezproxy/login
  defaults:
    _form: '\Drupal\ezproxy\Form\EzproxyAuthForm'
    _title: 'AADL Database Access Form'
